name: Ping Web

on:
  schedule:
    # Se ejecuta cada 6 horas (a las 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente también

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la web
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://andryus0312-collab.github.io/space-x92/
          echo "Web respondiendo correctamente ✅"
